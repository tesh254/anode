[package]
name = "anode"
version = "0.1.0"
edition = "2021"
description = "Native hardware programming IDE for MicroPython and Arduino"

[dependencies]
# Arduino sketches and native projects need the C/C++ grammars alongside
# Python; CMake and TOML cover the project files those builds are configured
# with (`CMakeLists.txt`, `platformio.ini`).
gpui-kit = { version = "0.9.1", features = [
    "tree-sitter-python",
    "tree-sitter-c",
    "tree-sitter-cpp",
    "tree-sitter-cmake",
    "tree-sitter-toml",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Wall-clock timestamps in the device log. Already in the dependency tree.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs = "6"
regex = "1"
tempfile = "3"
portable-pty = "0.9"
vt100 = "0.18"

[dependencies.serialport]
version = "4"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSData"] }
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSImage", "NSRunningApplication"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[build-dependencies]
# Rasterize `assets/app-icon.svg` into `OUT_DIR/app-icon.png` at compile time.
resvg = { version = "0.46", default-features = false, features = ["raster-images"] }
